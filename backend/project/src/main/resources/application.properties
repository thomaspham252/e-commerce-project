spring.application.name=project
server.port=${SERVER_PORT:8080}

# Đọc biến môi trường từ file .env (không đưa lên GitHub, xem .env.example)
spring.config.import=optional:file:.env[.properties]

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:job_portal_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# validate: schema do file job_portal_db.sql quản lý, Hibernate chỉ kiểm tra entity có khớp không
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ===== App =====
# Tạo dữ liệu mẫu khi bảng users trống (chỉ dùng lúc phát triển)
app.seed.enabled=${APP_SEED_ENABLED:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
